services:
  api:
    build: ..
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://maturity:maturity@postgres:5432/maturity}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: maturity
      POSTGRES_PASSWORD: maturity
      POSTGRES_DB: maturity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maturity"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9090
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Required to serve the Dashboard Schema V2 resource API that
      # grafana-dashboard-loader pushes maturity.json to.
      GF_FEATURE_TOGGLES_ENABLE: kubernetesDashboards,dashboardNewLayouts
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # maturity.json uses Dashboard Schema V2, which Grafana's file provisioner
  # refuses ("dashboard appears to be in v2 format"). Only the resource API
  # accepts it, so the dashboard is pushed by this one-shot job instead.
  grafana-dashboard-loader:
    image: python:3.12-alpine
    volumes:
      - ./grafana/push-dashboard.py:/push-dashboard.py:ro
      - ./grafana/dashboards:/dashboards:ro
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USER: admin
      GRAFANA_PASSWORD: admin
    command: ["python3", "/push-dashboard.py"]
    restart: on-failure
    depends_on:
      - grafana

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
